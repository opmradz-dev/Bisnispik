    </div>

    <!-- ============================================================ -->
    <!-- ===== FIREBASE + APP LOGIC ===== -->
    <script type="module">
        // ================================================================
        // 1. IMPORTS
        // ================================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            set,
            push,
            onValue,
            get,
            update,
            serverTimestamp,
            onDisconnect,
            off,
            query,
            orderByChild,
            limitToLast,
            enableLogging
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // ================================================================
        // 2. CONFIG
        // ================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCHr0eemIkfHNFDUkSaFDklp_c1OgmSnl8",
            authDomain: "mybro-9ba5f.firebaseapp.com",
            databaseURL: "https://mybro-9ba5f-default-rtdb.firebaseio.com/",
            projectId: "mybro-9ba5f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Enable offline persistence
        try {
            // Firebase Realtime DB offline persistence is enabled by default for web
            // but we need to call keepSynced for specific refs
            console.log('🔥 Firebase offline persistence aktif');
        } catch (e) {
            console.warn('Offline persistence error:', e);
        }

        // ================================================================
        // 3. STATE
        // ================================================================
        const state = {
            currentUser: null, // { username, displayName, photoURL, bio, status }
            currentChat: null, // { partnerUsername, chatId }
            contacts: [], // array of { username, displayName, photoURL, bio, status, lastSeen }
            chats: [], // array of chat previews
            messages: [], // messages for current chat
            isOffline: false,
            listeners: [],
            unreadCounts: {}, // chatId -> count
        };

        // ================================================================
        // 4. DOM REFS
        // ================================================================
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const appEl = $('#app');
        const toastEl = $('#toast');
        const offlineBanner = $('#offlineBanner');

        // Auth
        const authScreen = $('#authScreen');
        const mainScreen = $('#mainScreen');
        const authForm = $('#authForm');
        const authUsername = $('#authUsername');
        const authPassword = $('#authPassword');
        const registerDisplayName = $('#registerDisplayName');
        const registerNameGroup = $('#registerNameGroup');
        const authSubmitBtn = $('#authSubmitBtn');
        const authError = $('#authError');
        const authSuccess = $('#authSuccess');
        const authSwitchLink = $('#authSwitchLink');
        const authSwitchText = $('#authSwitchText');
        let isLoginMode = true;

        // Tabs
        const tabBtns = $$('.tab-btn');
        const tabContents = {
            chats: $('#tabChats'),
            contacts: $('#tabContacts'),
            profile: $('#tabProfile'),
        };

        // Chat list
        const chatListContainer = $('#chatListContainer');

        // Contacts
        const contactListContainer = $('#contactListContainer');
        const contactSearch = $('#contactSearch');
        const addContactBtn = $('#addContactBtn');

        // Profile
        const profileContainer = $('#profileContainer');

        // Chat screen
        const chatScreen = $('#chatScreen');
        const chatBackBtn = $('#chatBackBtn');
        const chatPartnerName = $('#chatPartnerName');
        const chatPartnerStatus = $('#chatPartnerStatus');
        const chatAvatar = $('#chatAvatar');
        const messagesContainer = $('#messagesContainer');
        const chatInput = $('#chatInput');
        const sendBtn = $('#sendBtn');

        // Modal
        const modalOverlay = $('#modalOverlay');
        const modalTitle = $('#modalTitle');
        const modalDesc = $('#modalDesc');
        const modalBody = $('#modalBody');
        const modalCancel = $('#modalCancel');
        const modalConfirm = $('#modalConfirm');

        // Header
        const headerStatusBtn = $('#headerStatusBtn');

        // ================================================================
        // 5. UTILITY
        // ================================================================
        function showToast(msg, duration = 2500) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
        }

        function getChatId(user1, user2) {
            const sorted = [user1, user2].sort();
            return sorted.join('_');
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const h = d.getHours().toString().padStart(2, '0');
            const m = d.getMinutes().toString().padStart(2, '0');
            if (isToday) return `${h}:${m}`;
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (d.toDateString() === yesterday.toDateString()) return `Kemarin ${h}:${m}`;
            return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        }

        function formatDateDivider(timestamp) {
            const d = new Date(timestamp);
            const now = new Date();
            const isToday = d.toDateString() === now.toDateString();
            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (isToday) return 'Hari ini';
            if (d.toDateString() === yesterday.toDateString()) return 'Kemarin';
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }

        function getInitials(name) {
            if (!name) return '?';
            const parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
            return name.slice(0, 2).toUpperCase();
        }

        function getAvatarColor(username) {
            const colors = ['#2b7a78', '#3aafa9', '#e67e22', '#2980b9', '#8e44ad', '#d35400', '#27ae60', '#c0392b', '#1abc9c',
                '#f39c12'
            ];
            let hash = 0;
            for (let i = 0; i < username.length; i++) {
                hash = username.charCodeAt(i) + ((hash << 5) - hash);
            }
            return colors[Math.abs(hash) % colors.length];
        }

        function scrollToBottom(el) {
            if (el) el.scrollTop = el.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ================================================================
        // 6. AUTH
        // ================================================================
        function switchAuthMode(login) {
            isLoginMode = login;
            authError.textContent = '';
            authSuccess.textContent = '';
            if (login) {
                authSubmitBtn.textContent = 'Masuk';
                authSwitchText.textContent = 'Belum punya akun?';
                authSwitchLink.textContent = 'Daftar';
                registerNameGroup.style.display = 'none';
                authPassword.placeholder = 'Masukkan password';
                authUsername.placeholder = 'Masukkan username';
            } else {
                authSubmitBtn.textContent = 'Daftar';
                authSwitchText.textContent = 'Sudah punya akun?';
                authSwitchLink.textContent = 'Masuk';
                registerNameGroup.style.display = 'block';
                authPassword.placeholder = 'Buat password';
                authUsername.placeholder = 'Pilih username';
            }
        }

        authSwitchLink.addEventListener('click', () => {
            switchAuthMode(!isLoginMode);
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.textContent = '';
            authSuccess.textContent = '';

            const username = authUsername.value.trim().toLowerCase();
            const password = authPassword.value.trim();
            const displayName = registerDisplayName.value.trim() || username;

            if (!username || !password) {
                authError.textContent = 'Username dan password wajib diisi.';
                return;
            }
            if (username.length < 3) {
                authError.textContent = 'Username minimal 3 karakter.';
                return;
            }
            if (password.length < 4) {
                authError.textContent = 'Password minimal 4 karakter.';
                return;
            }
            if (!isLoginMode && displayName.length < 2) {
                authError.textContent = 'Nama lengkap minimal 2 karakter.';
                return;
            }

            authSubmitBtn.disabled = true;
            authSubmitBtn.textContent = 'Memproses...';

            try {
                const userRef = ref(db, `users/${username}`);
                const snapshot = await get(userRef);

                if (isLoginMode) {
                    // LOGIN
                    if (!snapshot.exists()) {
                        authError.textContent = 'Username tidak ditemukan.';
                        authSubmitBtn.disabled = false;
                        authSubmitBtn.textContent = 'Masuk';
                        return;
                    }
                    const data = snapshot.val();
                    if (data.password !== password) {
                        authError.textContent = 'Password salah.';
                        authSubmitBtn.disabled = false;
                        authSubmitBtn.textContent = 'Masuk';
                        return;
                    }
                    // Login success
                    state.currentUser = {
                        username: username,
                        displayName: data.displayName || username,
                        photoURL: data.photoURL || '',
                        bio: data.bio || '',
                        status: data.status || 'offline',
                    };
                    // Update status to online
                    await update(userRef, {
                        status: 'online',
                        lastSeen: serverTimestamp()
                    });
                    // On disconnect set offline
                    const statusRef = ref(db, `users/${username}/status`);
                    onDisconnect(statusRef).set('offline');
                    const lastSeenRef = ref(db, `users/${username}/lastSeen`);
                    onDisconnect(lastSeenRef).set(serverTimestamp());

                    authSuccess.textContent = 'Login berhasil!';
                    showToast('Selamat datang, ' + state.currentUser.displayName + '!');
                    enterMainApp();

                } else {
                    // REGISTER
                    if (snapshot.exists()) {
                        authError.textContent = 'Username sudah digunakan.';
                        authSubmitBtn.disabled = false;
                        authSubmitBtn.textContent = 'Daftar';
                        return;
                    }
                    // Create user
                    await set(userRef, {
                        username: username,
                        password: password,
                        displayName: displayName,
                        photoURL: '',
                        bio: 'Halo, saya menggunakan MyBro Chat!',
                        status: 'online',
                        lastSeen: serverTimestamp(),
                        contacts: {},
                        chatRooms: {},
                    });
                    // On disconnect
                    const statusRef = ref(db, `users/${username}/status`);
                    onDisconnect(statusRef).set('offline');
                    const lastSeenRef = ref(db, `users/${username}/lastSeen`);
                    onDisconnect(lastSeenRef).set(serverTimestamp());

                    state.currentUser = {
                        username: username,
                        displayName: displayName,
                        photoURL: '',
                        bio: 'Halo, saya menggunakan MyBro Chat!',
                        status: 'online',
                    };
                    authSuccess.textContent = 'Akun berhasil dibuat!';
                    showToast('Akun berhasil dibuat! Selamat datang ' + displayName);
                    enterMainApp();
                }
            } catch (err) {
                console.error(err);
                authError.textContent = 'Terjadi kesalahan: ' + err.message;
            }
            authSubmitBtn.disabled = false;
            authSubmitBtn.textContent = isLoginMode ? 'Masuk' : 'Daftar';
        });

        function enterMainApp() {
            authScreen.classList.remove('active');
            mainScreen.classList.add('active');
            mainScreen.classList.add('slide-in');
            // Load data
            loadChats();
            loadContacts();
            loadProfile();
            checkOnlineStatus();
            // Listen for online/offline
            window.addEventListener('online', () => {
                state.isOffline = false;
                offlineBanner.classList.remove('show');
                showToast('Kembali online!');
                updateUserStatus('online');
                loadChats();
                loadContacts();
            });
            window.addEventListener('offline', () => {
                state.isOffline = true;
                offlineBanner.classList.add('show');
                showToast('Mode offline — pesan akan tersimpan nanti.');
                updateUserStatus('offline');
            });
            // Initial check
            if (!navigator.onLine) {
                state.isOffline = true;
                offlineBanner.classList.add('show');
            }
        }

        // ================================================================
        // 7. USER STATUS
        // ================================================================
        async function updateUserStatus(status) {
            if (!state.currentUser) return;
            try {
                await update(ref(db, `users/${state.currentUser.username}`), {
                    status: status,
                    lastSeen: serverTimestamp()
                });
            } catch (e) { /* ignore */ }
        }

        function checkOnlineStatus() {
            const status = navigator.onLine ? 'online' : 'offline';
            state.isOffline = !navigator.onLine;
            if (state.isOffline) offlineBanner.classList.add('show');
            else offlineBanner.classList.remove('show');
            // Update header indicator
            updateHeaderStatus();
        }

        function updateHeaderStatus() {
            const icon = headerStatusBtn.querySelector('i');
            if (state.isOffline) {
                icon.style.color = '#ff6b6b';
                headerStatusBtn.title = 'Offline';
            } else {
                icon.style.color = '#2ecc71';
                headerStatusBtn.title = 'Online';
            }
        }

        // ================================================================
        // 8. CHATS
        // ================================================================
        let chatListListener = null;
        let contactsListener = null;

        function loadChats() {
            if (chatListListener) {
                off(chatListListener);
                chatListListener = null;
            }
            if (!state.currentUser) return;

            const userChatsRef = ref(db, `users/${state.currentUser.username}/chatRooms`);
            chatListListener = onValue(userChatsRef, async (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    state.chats = [];
                    renderChatList();
                    return;
                }
                const chatIds = Object.keys(data);
                const chatPromises = chatIds.map(async (chatId) => {
                    const chatRef = ref(db, `chats/${chatId}`);
                    const chatSnap = await get(chatRef);
                    if (!chatSnap.exists()) return null;
                    const chat = chatSnap.val();
                    const participants = Object.keys(chat.participants || {});
                    const partner = participants.find(p => p !== state.currentUser.username) || '';
                    // Get partner info
                    const userRef = ref(db, `users/${partner}`);
                    const userSnap = await get(userRef);
                    const userData = userSnap.exists() ? userSnap.val() : {};
                    // Get unread count
                    const unreadRef = ref(db, `users/${state.currentUser.username}/unread/${chatId}`);
                    const unreadSnap = await get(unreadRef);
                    const unread = unreadSnap.exists() ? unreadSnap.val() : 0;

                    return {
                        chatId,
                        partner,
                        partnerDisplay: userData.displayName || partner,
                        partnerPhoto: userData.photoURL || '',
                        partnerStatus: userData.status || 'offline',
                        lastMessage: chat.lastMessage || '',
                        lastMessageTime: chat.lastMessageTime || 0,
                        lastMessageSender: chat.lastMessageSender || '',
                        unread: unread || 0,
                    };
                });
                const results = await Promise.all(chatPromises);
                state.chats = results.filter(c => c !== null);
                // Sort by lastMessageTime
                state.chats.sort((a, b) => (b.lastMessageTime || 0) - (a.lastMessageTime || 0));
                renderChatList();
            }, (err) => {
                console.error('Chat listener error:', err);
                // Try to load from cache
                renderChatList();
            });
        }

        function renderChatList() {
            if (!chatListContainer) return;
            const chats = state.chats;
            if (chats.length === 0) {
                chatListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-comment-slash"></i>
                        <h3>Belum ada chat</h3>
                        <p>Mulai percakapan dengan menambahkan kontak.</p>
                    </div>
                `;
                return;
            }
            let html = '';
            for (const chat of chats) {
                const lastMsg = chat.lastMessage || 'Mulai percakapan...';
                const time = chat.lastMessageTime ? formatTime(chat.lastMessageTime) : '';
                const isOnline = chat.partnerStatus === 'online';
                const initial = getInitials(chat.partnerDisplay);
                const color = getAvatarColor(chat.partner);
                const unreadBadge = chat.unread > 0 ? `<span class="unread">${chat.unread}</span>` : '';

                html += `
                    <div class="chat-item" data-chatid="${chat.chatId}" data-partner="${chat.partner}">
                        <div class="avatar" style="background:${color}">
                            ${initial}
                            <span class="status-dot ${isOnline ? 'online' : ''}"></span>
                        </div>
                        <div class="chat-info">
                            <div class="name">${escapeHtml(chat.partnerDisplay)}</div>
                            <div class="last-msg">${escapeHtml(lastMsg)}</div>
                        </div>
                        <div class="chat-meta">
                            <div class="time">${time}</div>
                            ${unreadBadge}
                        </div>
                    </div>
                `;
            }
            chatListContainer.innerHTML = html;

            // Click events
            chatListContainer.querySelectorAll('.chat-item').forEach(el => {
                el.addEventListener('click', () => {
                    const chatId = el.dataset.chatid;
                    const partner = el.dataset.partner;
                    openChat(chatId, partner);
                });
            });
        }

        // ================================================================
        // 9. CONTACTS
        // ================================================================
        function loadContacts() {
            if (contactsListener) {
                off(contactsListener);
                contactsListener = null;
            }
            if (!state.currentUser) return;

            const contactsRef = ref(db, `users/${state.currentUser.username}/contacts`);
            contactsListener = onValue(contactsRef, async (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    state.contacts = [];
                    renderContacts();
                    return;
                }
                const usernames = Object.keys(data);
                const contactPromises = usernames.map(async (uname) => {
                    const userRef = ref(db, `users/${uname}`);
                    const userSnap = await get(userRef);
                    if (!userSnap.exists()) return null;
                    const userData = userSnap.val();
                    return {
                        username: uname,
                        displayName: userData.displayName || uname,
                        photoURL: userData.photoURL || '',
                        bio: userData.bio || '',
                        status: userData.status || 'offline',
                        lastSeen: userData.lastSeen || 0,
                    };
                });
                const results = await Promise.all(contactPromises);
                state.contacts = results.filter(c => c !== null);
                renderContacts();
            }, (err) => {
                console.error('Contacts listener error:', err);
                renderContacts();
            });
        }

        function renderContacts(filter = '') {
            if (!contactListContainer) return;
            const search = filter.toLowerCase().trim();
            let list = state.contacts;
            if (search) {
                list = list.filter(c =>
                    c.displayName.toLowerCase().includes(search) ||
                    c.username.toLowerCase().includes(search)
                );
            }
            if (list.length === 0) {
                contactListContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-friends"></i>
                        <h3>${search ? 'Kontak tidak ditemukan' : 'Belum ada kontak'}</h3>
                        <p>${search ? 'Coba kata kunci lain' : 'Tambahkan kontak dengan tombol +'}</p>
                    </div>
                `;
                return;
            }
            let html = '';
            for (const contact of list) {
                const isOnline = contact.status === 'online';
                const initial = getInitials(contact.displayName);
                const color = getAvatarColor(contact.username);
                const bio = contact.bio || '';
                html += `
                    <div class="contact-item" data-username="${contact.username}">
                        <div class="avatar" style="background:${color}">
                            ${initial}
                            <span class="status-dot ${isOnline ? 'online' : ''}"></span>
                        </div>
                        <div class="info">
                            <div class="name">${escapeHtml(contact.displayName)}</div>
                            <div class="username">@${escapeHtml(contact.username)}</div>
                            ${bio ? `<div class="bio">${escapeHtml(bio)}</div>` : ''}
                        </div>
                        <div class="actions">
                            <button class="chat-btn" title="Chat"><i class="fas fa-comment"></i></button>
                            <button class="remove-btn" title="Hapus kontak"><i class="fas fa-user-minus"></i></button>
                        </div>
                    </div>
                `;
            }
            contactListContainer.innerHTML = html;

            // Events
            contactListContainer.querySelectorAll('.contact-item').forEach(el => {
                const uname = el.dataset.username;
                el.querySelector('.chat-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    const chatId = getChatId(state.currentUser.username, uname);
                    openChat(chatId, uname);
                });
                el.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    showRemoveContactModal(uname);
                });
                // Click on item -> open chat
                el.addEventListener('click', () => {
                    const chatId = getChatId(state.currentUser.username, uname);
                    openChat(chatId, uname);
                });
            });
        }

        contactSearch.addEventListener('input', () => {
            renderContacts(contactSearch.value);
        });

        addContactBtn.addEventListener('click', () => {
            showAddContactModal();
        });

        // ================================================================
        // 10. ADD / REMOVE CONTACT
        // ================================================================
        function showAddContactModal() {
            modalTitle.textContent = 'Tambah Kontak';
            modalDesc.textContent = 'Masukkan username teman Anda.';
            modalBody.innerHTML = `
                <input type="text" id="addContactInput" placeholder="Username" />
                <div id="addContactError" style="color:var(--danger);font-size:13px;margin-top:4px;"></div>
            `;
            modalConfirm.textContent = 'Tambah';
            modalConfirm.className = 'confirm-btn';
            modalOverlay.classList.add('open');

            const input = modalBody.querySelector('#addContactInput');
            const errorEl = modalBody.querySelector('#addContactError');

            const confirmHandler = async () => {
                const username = input.value.trim().toLowerCase();
                if (!username) {
                    errorEl.textContent = 'Masukkan username.';
                    return;
                }
                if (username === state.currentUser.username) {
                    errorEl.textContent = 'Tidak bisa menambahkan diri sendiri.';
                    return;
                }
                try {
                    const userRef = ref(db, `users/${username}`);
                    const snap = await get(userRef);
                    if (!snap.exists()) {
                        errorEl.textContent = 'Username tidak ditemukan.';
                        return;
                    }
                    // Check if already contact
                    const contactRef = ref(db, `users/${state.currentUser.username}/contacts/${username}`);
                    const contactSnap = await get(contactRef);
                    if (contactSnap.exists()) {
                        errorEl.textContent = 'Sudah ada di kontak.';
                        return;
                    }
                    // Add contact
                    await set(contactRef, true);
                    // Also add chatRoom entry
                    const chatId = getChatId(state.currentUser.username, username);
                    await set(ref(db, `users/${state.currentUser.username}/chatRooms/${chatId}`), true);
                    await set(ref(db, `users/${username}/chatRooms/${chatId}`), true);
                    // Initialize chat if not exists
                    const chatRef = ref(db, `chats/${chatId}`);
                    const chatSnap = await get(chatRef);
                    if (!chatSnap.exists()) {
                        await set(chatRef, {
                            participants: {
                                [state.currentUser.username]: true,
                                [username]: true
                            },
                            lastMessage: '',
                            lastMessageTime: 0,
                            lastMessageSender: '',
                        });
                    }
                    showToast(`Kontak ${username} berhasil ditambahkan!`);
                    modalOverlay.classList.remove('open');
                    loadContacts();
                    loadChats();
                } catch (err) {
                    errorEl.textContent = 'Error: ' + err.message;
                }
            };

            modalConfirm.onclick = confirmHandler;
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmHandler(); });
            modalCancel.onclick = () => modalOverlay.classList.remove('open');
            setTimeout(() => input.focus(), 100);
        }

        function showRemoveContactModal(username) {
            const contact = state.contacts.find(c => c.username === username);
            if (!contact) return;
            modalTitle.textContent = 'Hapus Kontak';
            modalDesc.textContent = `Hapus ${contact.displayName} dari daftar kontak?`;
            modalBody.innerHTML = '';
            modalConfirm.textContent = 'Hapus';
            modalConfirm.className = 'confirm-btn danger';
            modalOverlay.classList.add('open');

            const confirmHandler = async () => {
                try {
                    await set(ref(db, `users/${state.currentUser.username}/contacts/${username}`), null);
                    // Remove chatRoom? We keep it but remove from user's chatRooms
                    const chatId = getChatId(state.currentUser.username, username);
                    await set(ref(db, `users/${state.currentUser.username}/chatRooms/${chatId}`), null);
                    showToast(`Kontak dihapus.`);
                    modalOverlay.classList.remove('open');
                    loadContacts();
                    loadChats();
                } catch (err) {
                    showToast('Error: ' + err.message);
                }
            };

            modalConfirm.onclick = confirmHandler;
            modalCancel.onclick = () => modalOverlay.classList.remove('open');
        }

        // ================================================================
        // 11. CHAT SCREEN
        // ================================================================
        let messagesListener = null;
        let currentChatId = null;
        let currentPartner = null;

        function openChat(chatId, partnerUsername) {
            if (!state.currentUser) return;
            currentChatId = chatId;
            currentPartner = partnerUsername;

            // Hide main, show chat screen
            mainScreen.classList.remove('active');
            chatScreen.classList.add('active');
            chatScreen.classList.add('slide-in');

            // Clear messages
            messagesContainer.innerHTML = '';

            // Load partner info
            loadPartnerInfo(partnerUsername);

            // Load messages
            loadMessages(chatId);

            // Mark messages as read
            markAsRead(chatId);

            // Update unread count in UI
            const chat = state.chats.find(c => c.chatId === chatId);
            if (chat) {
                chat.unread = 0;
                renderChatList();
            }

            // Focus input
            chatInput.focus();
        }

        async function loadPartnerInfo(username) {
            try {
                const userRef = ref(db, `users/${username}`);
                const snap = await get(userRef);
                if (snap.exists()) {
                    const data = snap.val();
                    chatPartnerName.textContent = data.displayName || username;
                    chatPartnerStatus.textContent = data.status === 'online' ? 'Online' : 'Offline';
                    chatAvatar.textContent = getInitials(data.displayName || username);
                    chatAvatar.style.background = getAvatarColor(username);
                } else {
                    chatPartnerName.textContent = username;
                    chatPartnerStatus.textContent = 'Tidak ditemukan';
                    chatAvatar.textContent = '?';
                    chatAvatar.style.background = '#888';
                }
            } catch (e) {
                chatPartnerName.textContent = username;
                chatPartnerStatus.textContent = 'Error';
            }
        }

        function loadMessages(chatId) {
            if (messagesListener) {
                off(messagesListener);
                messagesListener = null;
            }
            const messagesRef = ref(db, `messages/${chatId}`);
            const messagesQuery = query(messagesRef, orderByChild('timestamp'), limitToLast(100));

            messagesListener = onValue(messagesQuery, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    state.messages = [];
                    renderMessages();
                    return;
                }
                const msgs = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key],
                }));
                msgs.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
                state.messages = msgs;
                renderMessages();
                scrollToBottom(messagesContainer);
            }, (err) => {
                console.error('Messages listener error:', err);
                // Show cached messages if any
                renderMessages();
            });

            // Keep synced for offline
            ref(db, `messages/${chatId}`).keepSynced(true);
        }

        function renderMessages() {
            if (!messagesContainer) return;
            const msgs = state.messages;
            if (msgs.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="empty-state" style="padding:40px 20px;">
                        <i class="fas fa-comment" style="font-size:40px;"></i>
                        <h3>Belum ada pesan</h3>
                        <p>Mulai percakapan sekarang!</p>
                    </div>
                `;
                return;
            }

            let html = '';
            let lastDate = null;

            for (const msg of msgs) {
                const msgDate = msg.timestamp ? new Date(msg.timestamp).toDateString() : null;
                if (msgDate && msgDate !== lastDate) {
                    lastDate = msgDate;
                    const label = formatDateDivider(msg.timestamp);
                    html += `<div class="msg-date-divider">${label}</div>`;
                }

                const isMe = msg.senderId === state.currentUser.username;
                const time = msg.timestamp ? formatTime(msg.timestamp) : '';
                const text = escapeHtml(msg.text || '');
                const cls = isMe ? 'me' : 'other';

                html += `
                    <div class="message ${cls}">
                        ${text}
                        <div class="msg-time">${time}</div>
                    </div>
                `;
            }
            messagesContainer.innerHTML = html;
            scrollToBottom(messagesContainer);
        }

        // ================================================================
        // 12. SEND MESSAGE
        // ================================================================
        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text || !currentChatId || !state.currentUser) return;
            if (state.isOffline) {
                showToast('Mode offline — pesan akan terkirim saat online.', 2000);
                // Still save locally via Firebase offline
            }

            const msgData = {
                senderId: state.currentUser.username,
                text: text,
                timestamp: serverTimestamp(),
                read: false,
            };

            try {
                const messagesRef = ref(db, `messages/${currentChatId}`);
                const newMsgRef = push(messagesRef);
                await set(newMsgRef, msgData);

                // Update last message in chat
                await update(ref(db, `chats/${currentChatId}`), {
                    lastMessage: text,
                    lastMessageTime: serverTimestamp(),
                    lastMessageSender: state.currentUser.username,
                });

                // Update unread count for partner (unless partner is current chat)
                const partner = currentPartner;
                if (partner) {
                    const unreadRef = ref(db, `users/${partner}/unread/${currentChatId}`);
                    const snap = await get(unreadRef);
                    const currentCount = snap.exists() ? snap.val() : 0;
                    await set(unreadRef, currentCount + 1);
                }

                // Clear input
                chatInput.value = '';
                chatInput.focus();

                // Optimistically update UI
                // The listener will handle the rest

            } catch (err) {
                console.error('Send error:', err);
                showToast('Gagal mengirim pesan: ' + err.message);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ================================================================
        // 13. MARK AS READ
        // ================================================================
        async function markAsRead(chatId) {
            if (!state.currentUser) return;
            try {
                await set(ref(db, `users/${state.currentUser.username}/unread/${chatId}`), 0);
            } catch (e) { /* ignore */ }
        }

        // ================================================================
        // 14. PROFILE
        // ================================================================
        let profileListener = null;

        function loadProfile() {
            if (profileListener) {
                off(profileListener);
                profileListener = null;
            }
            if (!state.currentUser) return;

            const userRef = ref(db, `users/${state.currentUser.username}`);
            profileListener = onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    state.currentUser.displayName = data.displayName || state.currentUser.username;
                    state.currentUser.photoURL = data.photoURL || '';
                    state.currentUser.bio = data.bio || '';
                    state.currentUser.status = data.status || 'offline';
                }
                renderProfile();
            }, (err) => {
                console.error('Profile listener error:', err);
                renderProfile();
            });

            ref(db, `users/${state.currentUser.username}`).keepSynced(true);
        }

        function renderProfile() {
            if (!profileContainer) return;
            const user = state.currentUser;
            if (!user) return;

            const initial = getInitials(user.displayName);
            const color = getAvatarColor(user.username);
            const isOnline = user.status === 'online';

            profileContainer.innerHTML = `
                <div class="profile-card">
                    <div class="avatar-large" style="background:${color}">${initial}</div>
                    <div class="name-large">${escapeHtml(user.displayName)}</div>
                    <div class="username-large">@${escapeHtml(user.username)}</div>
                    <div class="bio-large">${escapeHtml(user.bio || '')}</div>
                    <div class="status-large">
                        <span class="dot ${isOnline ? 'online' : 'offline'}"></span>
                        ${isOnline ? 'Online' : 'Offline'}
                    </div>
                </div>

                <div class="profile-card">
                    <div class="profile-field">
                        <label>Nama Lengkap</label>
                        <div class="value">
                            <span id="profileDisplayName">${escapeHtml(user.displayName)}</span>
                            <button class="edit-btn" data-field="displayName"><i class="fas fa-pen"></i> Edit</button>
                        </div>
                    </div>
                    <div class="profile-field">
                        <label>Bio</label>
                        <div class="value">
                            <span id="profileBio">${escapeHtml(user.bio || '')}</span>
                            <button class="edit-btn" data-field="bio"><i class="fas fa-pen"></i> Edit</button>
                        </div>
                    </div>
                    <div class="profile-field">
                        <label>Username</label>
                        <div class="value" style="color:var(--text-muted);">${escapeHtml(user.username)}</div>
                    </div>
                </div>

                <div class="profile-card">
                    <div class="profile-actions">
                        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                        <button class="danger-btn" id="deleteAccountBtn"><i class="fas fa-trash"></i> Hapus Akun</button>
                    </div>
                </div>
            `;

            // Edit handlers
            profileContainer.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const field = btn.dataset.field;
                    showEditProfileModal(field);
                });
            });

            // Logout
            profileContainer.querySelector('#logoutBtn').addEventListener('click', logout);

            // Delete account
            profileContainer.querySelector('#deleteAccountBtn').addEventListener('click', showDeleteAccountModal);
        }

        function showEditProfileModal(field) {
            const user = state.currentUser;
            const labels = {
                displayName: 'Nama Lengkap',
                bio: 'Bio'
            };
            const currentValue = user[field] || '';
            modalTitle.textContent = `Edit ${labels[field] || field}`;
            modalDesc.textContent = '';
            modalBody.innerHTML = `
                <input type="text" id="editProfileInput" value="${escapeHtml(currentValue)}" placeholder="${labels[field] || field}" />
                <div id="editProfileError" style="color:var(--danger);font-size:13px;margin-top:4px;"></div>
            `;
            modalConfirm.textContent = 'Simpan';
            modalConfirm.className = 'confirm-btn';
            modalOverlay.classList.add('open');

            const input = modalBody.querySelector('#editProfileInput');
            const errorEl = modalBody.querySelector('#editProfileError');

            const confirmHandler = async () => {
                const val = input.value.trim();
                if (!val) {
                    errorEl.textContent = 'Tidak boleh kosong.';
                    return;
                }
                try {
                    await update(ref(db, `users/${user.username}`), { [field]: val });
                    state.currentUser[field] = val;
                    showToast(`${labels[field] || field} diperbarui!`);
                    modalOverlay.classList.remove('open');
                    renderProfile();
                    // Update header if displayName changed
                    if (field === 'displayName') {
                        // Re-render chats/contacts
                        loadChats();
                        loadContacts();
                    }
                } catch (err) {
                    errorEl.textContent = 'Error: ' + err.message;
                }
            };

            modalConfirm.onclick = confirmHandler;
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmHandler(); });
            modalCancel.onclick = () => modalOverlay.classList.remove('open');
            setTimeout(() => input.focus(), 100);
        }

        function showDeleteAccountModal() {
            modalTitle.textContent = 'Hapus Akun';
            modalDesc.textContent = 'Semua data Anda akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.';
            modalBody.innerHTML = `
                <p style="color:var(--danger);font-weight:600;">Ketik <strong>${state.currentUser.username}</strong> untuk konfirmasi</p>
                <input type="text" id="deleteConfirmInput" placeholder="Masukkan username" />
                <div id="deleteConfirmError" style="color:var(--danger);font-size:13px;margin-top:4px;"></div>
            `;
            modalConfirm.textContent = 'Hapus Akun';
            modalConfirm.className = 'confirm-btn danger';
            modalOverlay.classList.add('open');

            const input = modalBody.querySelector('#deleteConfirmInput');
            const errorEl = modalBody.querySelector('#deleteConfirmError');

            const confirmHandler = async () => {
                const val = input.value.trim();
                if (val !== state.currentUser.username) {
                    errorEl.textContent = 'Username tidak cocok.';
                    return;
                }
                try {
                    const username = state.currentUser.username;
                    // Delete user data
                    await set(ref(db, `users/${username}`), null);
                    // Remove from contacts of others
                    // We'll do a simple cleanup: find all users and remove from contacts
                    const allUsersRef = ref(db, 'users');
                    const allUsersSnap = await get(allUsersRef);
                    if (allUsersSnap.exists()) {
                        const allUsers = allUsersSnap.val();
                        for (const [uid, _] of Object.entries(allUsers)) {
                            if (uid !== username) {
                                await set(ref(db, `users/${uid}/contacts/${username}`), null);
                                const chatId = getChatId(username, uid);
                                await set(ref(db, `users/${uid}/chatRooms/${chatId}`), null);
                            }
                        }
                    }
                    // Remove chat rooms
                    const chatRoomsRef = ref(db, `chats`);
                    const chatRoomsSnap = await get(chatRoomsRef);
                    if (chatRoomsSnap.exists()) {
                        const chats = chatRoomsSnap.val();
                        for (const [cid, chat] of Object.entries(chats)) {
                            if (chat.participants && chat.participants[username]) {
                                await set(ref(db, `chats/${cid}`), null);
                                await set(ref(db, `messages/${cid}`), null);
                            }
                        }
                    }
                    showToast('Akun berhasil dihapus.');
                    modalOverlay.classList.remove('open');
                    logout();
                } catch (err) {
                    errorEl.textContent = 'Error: ' + err.message;
                }
            };

            modalConfirm.onclick = confirmHandler;
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmHandler(); });
            modalCancel.onclick = () => modalOverlay.classList.remove('open');
            setTimeout(() => input.focus(), 100);
        }

        // ================================================================
        // 15. LOGOUT
        // ================================================================
        async function logout() {
            try {
                if (state.currentUser) {
                    await updateUserStatus('offline');
                    // Detach listeners
                    if (chatListListener) { off(chatListListener);
                        chatListListener = null; }
                    if (contactsListener) { off(contactsListener);
                        contactsListener = null; }
                    if (messagesListener) { off(messagesListener);
                        messagesListener = null; }
                    if (profileListener) { off(profileListener);
                        profileListener = null; }
                }
                state.currentUser = null;
                state.chats = [];
                state.contacts = [];
                state.messages = [];
                state.currentChat = null;
                currentChatId = null;
                currentPartner = null;

                // Switch screens
                chatScreen.classList.remove('active');
                mainScreen.classList.remove('active');
                authScreen.classList.add('active');
                authScreen.classList.remove('slide-in');

                // Reset auth form
                authPassword.value = '';
                authUsername.value = '';
                registerDisplayName.value = '';
                authError.textContent = '';
                authSuccess.textContent = '';
                switchAuthMode(true);

                showToast('Anda telah logout.');
            } catch (err) {
                console.error('Logout error:', err);
                showToast('Error saat logout.');
            }
        }

        // ================================================================
        // 16. TAB SWITCHING
        // ================================================================
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.dataset.tab;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                Object.keys(tabContents).forEach(key => {
                    const el = tabContents[key];
                    if (key === 'chats' && tabId === 'tabChats') {
                        el.classList.add('active');
                    } else if (key === 'contacts' && tabId === 'tabContacts') {
                        el.classList.add('active');
                    } else if (key === 'profile' && tabId === 'tabProfile') {
                        el.classList.add('active');
                    } else {
                        el.classList.remove('active');
                    }
                });
                // Refresh data when switching tabs
                if (tabId === 'tabChats') loadChats();
                if (tabId === 'tabContacts') loadContacts();
                if (tabId === 'tabProfile') loadProfile();
            });
        });

        // ================================================================
        // 17. CHAT BACK BUTTON
        // ================================================================
        chatBackBtn.addEventListener('click', () => {
            chatScreen.classList.remove('active');
            chatScreen.classList.remove('slide-in');
            mainScreen.classList.add('active');
            // Mark messages as read
            if (currentChatId) markAsRead(currentChatId);
            if (messagesListener) {
                off(messagesListener);
                messagesListener = null;
            }
            currentChatId = null;
            currentPartner = null;
            loadChats();
        });

        // ================================================================
        // 18. HEADER STATUS BUTTON (toggle status)
        // ================================================================
        headerStatusBtn.addEventListener('click', async () => {
            if (!state.currentUser) return;
            const newStatus = state.isOffline ? 'online' : 'offline';
            state.isOffline = (newStatus === 'offline');
            await updateUserStatus(newStatus);
            if (state.isOffline) {
                offlineBanner.classList.add('show');
                showToast('Mode offline diaktifkan');
            } else {
                offlineBanner.classList.remove('show');
                showToast('Mode online diaktifkan');
            }
            updateHeaderStatus();
            // Force re-render of contacts/chats to show status
            loadContacts();
            loadChats();
        });

        // ================================================================
        // 19. INIT
        // ================================================================
        // Check if user is already logged in (session via localStorage)
        // We'll use a simple session flag
        const sessionUser = localStorage.getItem('mybro_session');
        if (sessionUser) {
            try {
                const parsed = JSON.parse(sessionUser);
                state.currentUser = parsed;
                // Attempt to re-login silently
                // Just show the main screen, but we need to verify
                // For simplicity, we'll just show login screen and let user login again
                // Actually, let's auto-login with stored credentials? No, for security.
                // Just show login screen.
                localStorage.removeItem('mybro_session');
            } catch (e) { /* ignore */ }
        }

        // Save session on login
        const originalEnterMain = enterMainApp;
        enterMainApp = function() {
            if (state.currentUser) {
                localStorage.setItem('mybro_session', JSON.stringify({
                    username: state.currentUser.username,
                    displayName: state.currentUser.displayName,
                }));
            }
            originalEnterMain.call(this);
        };

        // Override logout to clear session
        const originalLogout = logout;
        logout = async function() {
            localStorage.removeItem('mybro_session');
            await originalLogout.call(this);
        };

        // Start with login screen
        switchAuthMode(true);

        // Listen for visibility change to update status
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (state.currentUser) updateUserStatus('offline');
            } else {
                if (state.currentUser) updateUserStatus('online');
            }
        });

        console.log('🚀 MyBro Chat siap!');
        console.log('📱 Mode offline/online didukung oleh Firebase Realtime Database.');

        // Handle beforeunload to set offline
        window.addEventListener('beforeunload', () => {
            if (state.currentUser) {
                updateUserStatus('offline');
            }
        });

        // ================================================================
        // 20. KEYBOARD SHORTCUTS
        // ================================================================
        document.addEventListener('keydown', (e) => {
            // Escape to close modal or chat
            if (e.key === 'Escape') {
                if (modalOverlay.classList.contains('open')) {
                    modalOverlay.classList.remove('open');
                } else if (chatScreen.classList.contains('active')) {
                    chatBackBtn.click();
                }
            }
        });

        // Click outside modal to close
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('open');
            }
        });

        console.log('✅ Aplikasi siap digunakan!');
    </script>
</body>
</html>
